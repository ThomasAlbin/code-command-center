<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session key</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="row">
      <label for="pin">Session</label>
      <select id="pin">
        <option value="">Automatic</option>
      </select>
    </div>
    <p class="hint">
      Automatic keys fill with sessions in reading order. A chosen project stays on this key, also while it is not
      running. On the device, hold the key for a moment to step through the running projects.
    </p>
    <script src="session.js"></script>
  </body>
</html>
